[package]
name = "flipper-fake"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A scripted fake Flipper Zero speaking the serial CLI handshake and protobuf RPC, and a fake STM32WB55 DFU bootloader, for testing Argus without a device"
publish = false

[dependencies]
flipper-rpc = { path = "../flipper-rpc" }
flipper-dfu = { path = "../flipper-dfu" }
prost = "0.14"
md-5 = "0.10"
sha2 = "0.10"
serialport = { version = "4.10", default-features = false }
nix = { version = "0.26", default-features = false, features = ["poll"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"

[[bin]]
name = "flipper-fake"
path = "src/main.rs"

[dev-dependencies]
tar = { version = "0.4", default-features = false }
