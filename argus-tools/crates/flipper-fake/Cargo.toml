[package]
name = "flipper-fake"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A scripted fake Flipper Zero speaking the serial CLI handshake and protobuf RPC, for testing Argus without a device"
publish = false

[dependencies]
flipper-rpc = { path = "../flipper-rpc" }
prost = "0.14"
md-5 = "0.10"
serialport = { version = "4.10", default-features = false }
nix = { version = "0.26", default-features = false, features = ["poll"] }

[[bin]]
name = "flipper-fake"
path = "src/main.rs"

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
