[package]
name = "argus-api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The Sarina control API of Argus in Rust, the port of backend/chymaera (SarinaServer, Bridge, the event log): loopback only, a token on every request, the C++ server's wire format byte for byte"
publish = false

[dependencies]
argus-capture = { path = "../argus-capture" }
flipper-rpc = { path = "../flipper-rpc" }
argus-tools = { path = "../.." }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
rusqlite = "0.42"
flipper-fake = { path = "../flipper-fake" }
