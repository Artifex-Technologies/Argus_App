[package]
name = "argus-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The Rust port of qFlipper-cli for Argus: talks to a Flipper Zero over its RPC protocol, one JSON object per command"
publish = false

[[bin]]
name = "argus-cli"
path = "src/main.rs"

[dependencies]
flipper-rpc = { path = "../flipper-rpc" }
flipper-dfu = { path = "../flipper-dfu" }
argus-capture = { path = "../argus-capture" }
argus-api = { path = "../argus-api" }
flipper-updates = { path = "../flipper-updates" }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
flipper-fake = { path = "../flipper-fake" }
md-5 = "0.10"
hex = "0.4"
