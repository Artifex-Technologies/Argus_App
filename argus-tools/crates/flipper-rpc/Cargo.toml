[package]
name = "flipper-rpc"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Flipper Zero RPC for Argus: protobuf messages (prost, from the firmware's .proto files), length-delimited framing, the serial session handshake and read-only operations"
publish = false

[dependencies]
prost = "0.14"
serialport = { version = "4.10", default-features = false }

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
prost-types = "0.14"
proptest = "1"
