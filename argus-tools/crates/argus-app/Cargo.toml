[package]
name = "argus-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The Argus desktop app in Rust (egui/eframe), the port of the Qt app's application/ folder: device, screen, files, backup and restore, updates, captures and the Sarina API, recovery"
publish = false

[[bin]]
name = "argus-app"
path = "src/main.rs"

[dependencies]
# the toolkit and version family of Yggdrasil's own apps
eframe = "0.36.2"
flipper-rpc = { path = "../flipper-rpc" }
flipper-updates = { path = "../flipper-updates" }
# recovery through flipper_dfu::recovery's Bootloader interface; without its usb feature (nothing can open USB)
flipper-dfu = { path = "../flipper-dfu" }
argus-api = { path = "../argus-api" }
argus-capture = { path = "../argus-capture" }
# the Argus tools window: the same library the Qt app runs as a process
argus-tools = { path = "../.." }
serde_json = "1"
png = "0.18"

[dev-dependencies]
flipper-fake = { path = "../flipper-fake" }
# the tests' own CA for the local update server
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider"] }
# the fake Limbo agent's guest output (a built app, base64)
base64 = "0.22"
