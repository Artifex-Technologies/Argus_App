[package]
name = "argus-tools"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Non-UI logic for Argus_App: firmware package app extraction, FAP manifests and API compatibility, SD card snapshots, capture library, Limbo rebuilds"
publish = false

[workspace]
members = [".", "crates/flipper-rpc", "crates/flipper-fake", "crates/argus-cli", "crates/argus-capture", "crates/argus-api", "crates/flipper-dfu"]

[lib]
name = "argus_tools"
path = "src/lib.rs"

[[bin]]
name = "argus-tools"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
