name: 'argus-tools'

# argus-tools (the Rust workspace: argus-tools itself and the Rust port in argus-tools/crates): formatting (its
# rustfmt.toml), lints and tests on every change to it, so formatting and lint debt cannot come back. The port's protocol
# tests read the C++ app's generated nanopb code, so changes there run this too. The Qt app is built by linux.yml.
on:
  push:
    paths:
      - 'argus-tools/**'
      - 'plugins/flipperproto0/messages/**'
      - '3rdparty/nanopb'
      - 'VERSION'
      - '.github/workflows/argus-tools.yml'
  pull_request:
    paths:
      - 'argus-tools/**'
      - 'plugins/flipperproto0/messages/**'
      - '3rdparty/nanopb'
      - 'VERSION'
      - '.github/workflows/argus-tools.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1' # the audit weekly, for advisories published after the last change

permissions:
  contents: read

concurrency:
  group: argus-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # the desktop app (argus-app) builds eframe and wgpu
    timeout-minutes: 45
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git rust base-devel protobuf sqlite

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false

      - name: Format
        working-directory: argus-tools
        run: cargo fmt --all --check

      - name: Lint
        working-directory: argus-tools
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The real USB transport of the recovery port (nusb) is behind a feature that no test enables; lint it too.
      - name: Lint the USB transport
        working-directory: argus-tools
        run: cargo clippy --locked -p flipper-dfu --features usb --all-targets -- -D warnings

      - name: Test
        working-directory: argus-tools
        run: cargo test --locked --workspace

      # The protocol fixture must come from the C++ app's own nanopb encoder: rebuild it and fail if it differs.
      - name: nanopb fixture is current
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init 3rdparty/nanopb
          sh argus-tools/crates/flipper-rpc/tests/nanopb/gen.sh
          git diff --exit-code -- argus-tools/crates/flipper-rpc/tests/fixtures/nanopb_frames.txt

  # argus-tools' lock file against RustSec's advisories (the fuzz crate's is not committed)
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - run: cargo install --locked cargo-audit
      # Unmaintained notices (no vulnerability, no fixed version) for crates the desktop app gets from eframe 0.36:
      # RUSTSEC-2026-0192 ttf-parser (window decorations' font) and RUSTSEC-2026-0370 to 0372 zvariant/zbus_names (the
      # screen reader link). Revisit at each eframe update.
      - run: >-
          cargo audit --file argus-tools/Cargo.lock --deny warnings --ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0370
          --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372
