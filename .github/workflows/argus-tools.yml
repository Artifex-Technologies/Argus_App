name: 'argus-tools'

# argus-tools (the Rust non-UI logic): formatting (its rustfmt.toml) and lints on every change to it, so formatting and
# lint debt cannot come back. The Qt app is built by linux.yml.
on:
  push:
    paths:
      - 'argus-tools/**'
      - '.github/workflows/argus-tools.yml'
  pull_request:
    paths:
      - 'argus-tools/**'
      - '.github/workflows/argus-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git rust base-devel

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false

      - name: Format
        working-directory: argus-tools
        run: cargo fmt --check

      - name: Lint
        working-directory: argus-tools
        run: cargo clippy --locked --all-targets -- -D warnings

      # cargo test is not run here yet: tests/capture.rs fails on the runner's file system (the capture index names a
      # duplicate after whichever copy read_dir returns first; garage vs garage_backup), which needs a fix of its own.
