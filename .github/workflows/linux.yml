name: 'Linux build'

# Builds Argus_App on GitHub's own runners the docs/LINUX_BUILD.md way: an Arch Linux container,
# Qt 6 from the distro, qmake6 + make. Runs the subsystem self-test and keeps a relocatable
# tarball (.github/scripts/package_linux.sh). Upstream's ci.yml needs Flipper's runners and
# stays manual-only.
on:
  push:
    branches:
      - main
    tags:
      # the app's releases (Labyrinth_OS's scripts/release.sh tags them vX.Y.Z)
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git qt6-base qt6-declarative qt6-svg qt6-5compat \
            qt6-serialport qt6-tools libusb sqlite zlib

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          # The version is the VERSION file; the full history stays for the commit the app names.
          fetch-depth: 0
          submodules: recursive

      - name: Build, self-test and package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/scripts/package_linux.sh build-release

      # The Rust port's proof against the C++ app (docs/RUST_PORT.md, section 4): both CLIs back up and pull
      # captures from the same fake Flipper over a pseudo-terminal; archives, datastore rows, requests and exit
      # codes are compared. Rust is installed only here, so the build and package step above runs exactly as
      # before.
      - name: Compare qFlipper-cli with argus-cli on the fake Flipper
        run: |
          pacman -S --noconfirm --needed rust protobuf
          (cd argus-tools && cargo build --locked -j4 -p argus-cli -p flipper-fake)
          QT_QPA_PLATFORM=offscreen sh argus-tools/crates/flipper-fake/compare-cli.sh build-release/qFlipper-cli \
            argus-tools/target/debug/argus-cli argus-tools/target/debug/flipper-fake "$RUNNER_TEMP/compare"
          # the capture metadata against the C++ parser itself, 3000 generated files
          sh argus-tools/crates/argus-capture/tests/qt-oracle/build.sh "$RUNNER_TEMP/qt-oracle"
          (cd argus-tools && ARGUS_QT_ORACLE="$RUNNER_TEMP/qt-oracle" cargo test --locked -j4 -p argus-capture --test qt_oracle)

      # The Sarina control API: the C++ server and the Rust one answer the same recorded requests byte for byte
      # (and the C++ answers are still tests/fixtures/api_responses.txt, which argus-tools.yml replays against the
      # Rust code); Qt's own JSON parser and the C++ pcap writer against the Rust ones.
      - name: Compare the Sarina API servers (C++ and Rust)
        run: |
          pacman -S --noconfirm --needed iproute2
          (cd argus-tools && cargo build --locked -j4 -p argus-cli -p argus-tools -p flipper-fake)
          bash argus-tools/crates/argus-api/compare-api.sh build-release/qFlipper-cli argus-tools/target/debug/argus-cli \
            argus-tools/target/debug/argus-tools argus-tools/target/debug/flipper-fake "$RUNNER_TEMP/compare-api"
          sh argus-tools/crates/argus-api/tests/qt-oracle/build.sh "$RUNNER_TEMP/api-oracles"
          (cd argus-tools && ARGUS_QT_ORACLES="$RUNNER_TEMP/api-oracles" cargo test --locked -j4 -p argus-api --test qt_json --test pcap)

      # Recovery (DFU): the C++ app's own DfuSe file parser and memory layout reader (dfu/) against the Rust port's
      # (argus-tools/crates/flipper-dfu) on 3000 generated and damaged files and 4000 interface strings, and the C++
      # DfuseDevice and STM32WB55 (option bytes, FUS, recovery steps) against the Rust port on one fake DFU bootloader
      # (USB replaced by a pipe; nothing opens a device).
      - name: Compare the DfuSe parsers and protocol (C++ and Rust)
        run: |
          sh argus-tools/crates/flipper-dfu/tests/qt-oracle/build.sh "$RUNNER_TEMP/dfu-oracle"
          (cd argus-tools && ARGUS_DFU_ORACLE="$RUNNER_TEMP/dfu-oracle" cargo test --locked -j4 -p flipper-dfu --test qt_oracle --test qt_device --test qt_wb55)

      # The full repair and the legacy update: qFlipper-cli (FullRepairOperation, LegacyUpdateOperation, through its
      # test hooks: the bootloader over a socket, the devices from a state file, the update files from a made-up local
      # folder) and argus-cli recovery repair|legacy-update on the same fake Flipper across its resets; requests,
      # flash, option bytes, the card and exit codes compared. No USB, no network.
      - name: Compare the full repair and the legacy update (C++ and Rust)
        run: |
          (cd argus-tools && cargo build --locked -j4 -p argus-cli -p flipper-fake)
          sh argus-tools/crates/flipper-fake/compare-repair.sh build-release/qFlipper-cli argus-tools/target/debug/argus-cli \
            argus-tools/target/debug/flipper-fake "$RUNNER_TEMP/compare-repair"

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned by commit
        with:
          name: argus-app-linux-x86_64
          path: |
            build-release/argus-app-*-linux-x86_64.tar.gz
            build-release/argus-app-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
